[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/unifi_network_extended"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    # Abstract hooks that subclasses must override.
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
force-sort-within-sections = true
combine-as-imports = true
