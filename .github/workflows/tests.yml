name: Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.5
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests

  pytest:
    name: pytest (Home Assistant ${{ matrix.name }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum version from hacs.json (2025.3.0 = first release with
          # AddConfigEntryEntitiesCallback). Keep in sync with hacs.json.
          - name: "2025.3.0 (minimum)"
            python-version: "3.13"
            plugin: "0.13.221"
          # Last Home Assistant release for Python 3.13 (older API paths,
          # e.g. via_device instead of via_device_id).
          - name: "2026.2.3"
            python-version: "3.13"
            plugin: "0.13.316"
          # Current release: version pinned in requirements_test.txt,
          # updated by Dependabot.
          - name: "current"
            python-version: "3.14"
            plugin: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        env:
          PLUGIN_VERSION: ${{ matrix.plugin }}
        run: |
          if [ -n "$PLUGIN_VERSION" ]; then
            # Home Assistant 2025.3.0 pins a yanked aiohttp release; pip still
            # installs it for an exact pin (with a warning).
            pip install "pytest-homeassistant-custom-component==$PLUGIN_VERSION"
          else
            pip install -r requirements_test.txt
          fi
      - name: Show Home Assistant version
        run: python -c "import homeassistant.const as c; print(c.__version__)"
      # Coverage settings are in pyproject.toml ([tool.coverage.*]). The job
      # fails if the coverage drops below the minimum.
      - name: pytest with coverage
        run: pytest -p no:cacheprovider --cov --cov-report=term-missing --cov-fail-under=97
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: |
          {
            echo "### Coverage (Home Assistant ${{ matrix.name }}, Python ${{ matrix.python-version }})"
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
